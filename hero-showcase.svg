<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f14"/>
      <stop offset="40%" stop-color="#171822"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d496"/>
      <stop offset="50%" stop-color="#e5b869"/>
      <stop offset="100%" stop-color="#b5893d"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#e5b869" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#e63946" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#09090c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#heroBg)"/>
  <circle cx="400" cy="450" r="300" fill="url(#heroGlow)" filter="url(#blurFilter)"/>

  <!-- Geometric Artwork Frame Elements -->
  <g stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none">
    <rect x="60" y="60" width="680" height="880" rx="16"/>
    <circle cx="400" cy="450" r="220" stroke-dasharray="4,8"/>
    <circle cx="400" cy="450" r="160"/>
    <line x1="60" y1="450" x2="740" y2="450" stroke-opacity="0.3"/>
    <line x1="400" y1="60" x2="400" y2="940" stroke-opacity="0.3"/>
  </g>

  <!-- Dynamic Artistic Sculptural Curves -->
  <path d="M 220 620 C 260 400, 540 500, 580 280" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.85"/>
  <path d="M 260 660 C 300 440, 500 460, 540 320" fill="none" stroke="#e63946" stroke-width="2" opacity="0.6"/>
  <path d="M 180 580 C 220 360, 580 540, 620 240" fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.5"/>

  <!-- Core Visual Focal Prism -->
  <g transform="translate(400, 450)">
    <!-- Central Hexagonal Star Monogram Emblem -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="rgba(20,20,28,0.75)" stroke="url(#accentGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="55" fill="rgba(14,15,20,0.9)" stroke="rgba(255,255,255,0.15)"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="url(#accentGrad)" letter-spacing="2">ESN</text>
  </g>

  <!-- Typography Badges within Graphic -->
  <g transform="translate(400, 720)">
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#f4f4f6" letter-spacing="1">VISUAL ART &amp; DESIGN</text>
    <text x="0" y="32" text-anchor="middle" font-family="'Space Grotesk', monospace" font-size="13" font-weight="600" fill="#e5b869" letter-spacing="3">EVRONYA SHOKRY NAGUIB</text>
    <text x="0" y="64" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Faculty of Digital Art - 2026 Portfolio</text>
  </g>

  <!-- Top Metadata -->
  <text x="100" y="110" font-family="'Space Grotesk', monospace" font-size="12" fill="#e5b869" letter-spacing="2">CURATED WORK</text>
  <text x="700" y="110" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="2">VOL. 2026</text>

  <!-- Bottom Corner Markings -->
  <text x="100" y="890" font-family="'Space Grotesk', monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">BRANDING - PACKAGING - CONCEPT ART</text>
  <text x="700" y="890" text-anchor="end" font-family="'Space Grotesk', monospace" font-size="11" fill="rgba(255,255,255,0.35)" letter-spacing="1">COMMERCIAL ADS</text>
</svg>

